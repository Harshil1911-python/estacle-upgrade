<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authorize · Estacle MCP</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #f1f5f9; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 28px; width: min(400px, 92vw);
            box-shadow: 0 8px 24px rgba(15,23,42,0.06); }
    h1 { margin: 0 0 6px; font-size: 1.25rem; color: #0f172a; }
    p { color: #64748b; font-size: 13px; line-height: 1.45; }
    label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin: 12px 0 4px; }
    input { width: 100%; height: 40px; border: 1px solid #e2e8f0; border-radius: 9px; padding: 0 12px;
            font: inherit; box-sizing: border-box; }
    button { width: 100%; margin-top: 16px; height: 42px; border: none; border-radius: 10px;
             background: #0f172a; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
    .err { background: #fef2f2; color: #b91c1c; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Connect Estacle to Claude</h1>
    <p>Sign in with your <strong>admin</strong> or <strong>agent</strong> Estacle account to authorize MCP access.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="client_id" value="{{ client_id }}">
      <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
      <input type="hidden" name="state" value="{{ state }}">
      <input type="hidden" name="code_challenge" value="{{ code_challenge }}">
      <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method }}">
      <input type="hidden" name="scope" value="{{ scope }}">
      <label>Email</label>
      <input type="email" name="email" required autocomplete="username" placeholder="you@company.com">
      <label>Password</label>
      <input type="password" name="password" required autocomplete="current-password">
      <button type="submit">Authorize</button>
    </form>
  </div>
</body>
</html>
